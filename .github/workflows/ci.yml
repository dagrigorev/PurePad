name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & test (warnings as errors)
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Test -WarnAsError

      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: >
          dotnet publish src/PurePad/PurePad.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:TreatWarningsAsErrors=true
          -o publish/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath PurePad-${{ matrix.rid }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurePad-${{ matrix.rid }}
          path: PurePad-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: ver
        shell: bash
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/PurePad/PurePad.csproj)
          if [ -z "$version" ]; then echo "::error::<Version> not found in PurePad.csproj"; exit 1; fi
          echo "tag=v${version}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          mkdir -p dist
          tag="${{ steps.ver.outputs.tag }}"
          for rid in win-x64 win-arm64; do
            src="artifacts/PurePad-${rid}/PurePad-${rid}.zip"
            [ -f "$src" ] || { echo "::error::missing artifact $src"; exit 1; }
            cp "$src" "dist/PurePad-${tag}-${rid}.zip"
          done
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.ver.outputs.tag }}"
          --target "${{ github.sha }}"
          --title "${{ steps.ver.outputs.tag }}"
          --generate-notes
          dist/*.zip
